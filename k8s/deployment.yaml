apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-calculator-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beam-calculator-backend
  template:
    metadata:
      labels:
        app: beam-calculator-backend
    spec:
      containers:
      - name: backend
        image: beamcalc/backend:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: beam-calculator-backend-svc
spec:
  selector:
    app: beam-calculator-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

